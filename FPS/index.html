<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web FPS - Full Menu</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background-color: #111; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        
        /* Game UI */
        #ui {
            position: absolute; top: 15px; left: 20px; color: #fff; 
            font-size: 24px; font-weight: bold; z-index: 5; 
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
            display: none; /* Hidden until game starts */
        }
        #crosshair {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: rgba(0, 255, 0, 0.8); font-size: 28px; font-weight: bold;
            pointer-events: none; display: none; z-index: 5;
        }

        /* Main Menu Overlay */
        #menu {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: linear-gradient(135deg, rgba(20,20,30,0.95), rgba(0,0,0,0.95)); 
            color: white; z-index: 10;
        }
        #menu h1 {
            font-size: 4rem; margin-bottom: 10px; color: #ff3366;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.5);
        }
        .instructions {
            background: rgba(255,255,255,0.1); padding: 15px 30px; border-radius: 8px;
            margin-bottom: 30px; font-size: 1.1rem; text-align: center; line-height: 1.6;
        }
        #startButton {
            padding: 15px 40px; font-size: 1.5rem; font-weight: bold;
            color: white; background-color: #ff3366; border: none; border-radius: 5px;
            cursor: pointer; transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 15px rgba(255, 51, 102, 0.4);
        }
        #startButton:hover {
            background-color: #ff5580; transform: scale(1.05);
        }
        #startButton:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="ui">Score: <span id="score">0</span></div>
    <div id="crosshair">+</div>

    <div id="menu">
        <h1>NEON TARGETS</h1>
        <div class="instructions">
            <strong>W A S D</strong> - Move<br>
            <strong>SPACE</strong> - Jump<br>
            <strong>LEFT CLICK</strong> - Shoot<br>
            <strong>ESC</strong> - Pause / Menu
        </div>
        <button id="startButton">PLAY GAME</button>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
        import { PointerLockControls } from 'https://unpkg.com/three@0.160.0/examples/jsm/controls/PointerLockControls.js';

        let camera, scene, renderer, controls;
        let targetBox;
        let score = 0;
        
        const menu = document.getElementById('menu');
        const ui = document.getElementById('ui');
        const crosshair = document.getElementById('crosshair');
        const scoreEl = document.getElementById('score');
        const startButton = document.getElementById('startButton');

        // Physics Variables
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false;
        let canJump = false;
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();
        const clock = new THREE.Clock();
        const raycaster = new THREE.Raycaster();

        init();
        animate();

        function init() {
            // 1. Scene Setup
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x111111, 0, 50); // Add fog for atmosphere
            scene.background = new THREE.Color(0x111111);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.y = 1.6;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 2. Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);

            // 3. Environment (Grid Floor)
            const gridHelper = new THREE.GridHelper(100, 50, 0x00ff00, 0x444444);
            scene.add(gridHelper);

            // 4. Target Object
            const geometry = new THREE.BoxGeometry(2, 2, 2);
            const material = new THREE.MeshPhongMaterial({ 
                color: 0xff3366, 
                emissive: 0x550011,
                shininess: 100
            });
            targetBox = new THREE.Mesh(geometry, material);
            targetBox.position.set(0, 1, -10);
            scene.add(targetBox);

            // 5. Controls & Menu Logic
            controls = new PointerLockControls(camera, document.body);

            startButton.addEventListener('click', () => {
                controls.lock(); // This triggers the browser pointer lock
            });

            controls.addEventListener('lock', () => {
                menu.style.display = 'none';
                ui.style.display = 'block';
                crosshair.style.display = 'block';
            });

            controls.addEventListener('unlock', () => {
                menu.style.display = 'flex';
                ui.style.display = 'none';
                crosshair.style.display = 'none';
                // Reset movement keys so you don't keep moving when unpaused
                moveForward = false; moveBackward = false; moveLeft = false; moveRight = false;
            });

            // 6. Event Listeners
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            window.addEventListener('click', shoot);
            window.addEventListener('resize', onWindowResize);
        }

        function onKeyDown(event) {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': 
                    if (canJump === true) velocity.y += 15; 
                    canJump = false;
                    break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function shoot() {
            if (controls.isLocked) {
                raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
                const intersects = raycaster.intersectObject(targetBox);

                if (intersects.length > 0) {
                    // Respawn target in a random spot
                    targetBox.position.set(
                        (Math.random() - 0.5) * 40,
                        1,
                        (Math.random() - 0.5) * 40
                    );
                    score += 100;
                    scoreEl.innerText = score;
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Only run physics if the game is active (menu is hidden)
            if (controls.isLocked) {
                const delta = clock.getDelta();

                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 5.0 * delta; // Gravity

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 100.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 100.0 * delta;

                const prevPosition = camera.position.clone();

                controls.moveRight(-velocity.x * delta);
                controls.moveForward(-velocity.z * delta);

                // Collision Detection
                const playerBox = new THREE.Box3().setFromCenterAndSize(
                    camera.position, new THREE.Vector3(1, 2, 1)
                );
                const targetBoundingBox = new THREE.Box3().setFromObject(targetBox);

                if (playerBox.intersectsBox(targetBoundingBox)) {
                    camera.position.x = prevPosition.x;
                    camera.position.z = prevPosition.z;
                    velocity.x = 0;
                    velocity.z = 0;
                }

                camera.position.y += velocity.y * delta;

                // Floor limits
                if (camera.position.y < 1.6) {
                    velocity.y = 0;
                    camera.position.y = 1.6;
                    canJump = true;
                }
            } else {
                // Keep the clock updating even when paused so delta time doesn't spike
                clock.getDelta(); 
            }

            // Rotate target slightly for visual flair
            targetBox.rotation.x += 0.01;
            targetBox.rotation.y += 0.01;

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
