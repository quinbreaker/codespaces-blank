// --- DOM Utilities (Terminal Emulator) ---
const outputDiv = document.getElementById('game-container');
const inputField = document.getElementById('cmd-input');

function print(text) {
    outputDiv.textContent += text + '\n';
    outputDiv.scrollTop = outputDiv.scrollHeight;
}

function clear_screen() {
    outputDiv.textContent = '';
}

function print_header(title) {
    print("=".repeat(60));
    let pad = Math.max(0, Math.floor((60 - title.length) / 2));
    print(" ".repeat(pad) + title);
    print("=".repeat(60));
}

function sleep(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
}

// Mimics Python's input()
function async_input(promptText) {
    return new Promise((resolve) => {
        print(promptText);
        inputField.disabled = false;
        inputField.focus();
        
        inputField.onkeydown = (e) => {
            if (e.key === 'Enter') {
                const val = inputField.value;
                outputDiv.textContent += val + '\n'; 
                inputField.value = '';
                inputField.disabled = true;
                inputField.onkeydown = null;
                resolve(val);
            }
        };
    });
}

// --- Class Definitions ---
class Card {
    constructor(suit, rank) {
        this.suit = suit;
        this.rank = rank;
        this.value = VALUES[rank];
    }
    toString() {
        return `${this.rank}${this.suit}`;
    }
    display_lines() {
        let r = this.rank.padEnd(2, ' ');
        return [
            "┌─────────┐",
            `│ ${r}      │`,
            `│    ${this.suit}    │`,
            `│      ${r} │`,
            "└─────────┘"
        ];
    }
}

class Deck {
    constructor() {
        this.cards = [];
        for (let s of SUITS) {
            for (let r of RANKS) {
                this.cards.push(new Card(s, r));
            }
        }
        this.shuffle();
    }
    shuffle() {
        for (let i = this.cards.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [this.cards[i], this.cards[j]] = [this.cards[j], this.cards[i]];
        }
    }
    deal() {
        return this.cards.length ? this.cards.pop() : null;
    }
}

class Player {
    constructor(name = "Ewan", money = 100) {
        this.name = name;
        this.money = money;
        this.loan_debt = 0;
        this.unlocked_achievements = new Set();
        this.stats = { games_played: 0, wins: 0, losses: 0, pushes: 0, blackjack_count: 0 };
    }

    print_status() {
        print(`💰 Wallet: $${this.money} | 🏦 Debt: $${this.loan_debt}`);
    }

    async unlock_achievement(key) {
        if (ACHIEVEMENTS_DB[key] && !this.unlocked_achievements.has(key)) {
            this.unlocked_achievements.add(key);
            let data = ACHIEVEMENTS_DB[key];
            print("\n" + "★".repeat(50));
            print(`🏆 UNLOCKED: ${data.title} 🏆`);
            print(`   ${data.desc}`);
            print("★".repeat(50) + "\n");
            await sleep(1500);
        }
    }

    check_stats_achievements() {
        if (this.stats.games_played >= 1) this.unlock_achievement("newbie");
        if (this.stats.games_played >= 10) this.unlock_achievement("regular");
        if (this.money === 0) this.unlock_achievement("broke");
        if (this.money >= 2500) this.unlock_achievement("high_roller");
    }
}

// --- Visual Utilities ---
function show_hands(player_hand, dealer_hand, hide_dealer_card = false) {
    let dealer_lines = [];
    if (dealer_hand.length > 0) {
        if (hide_dealer_card) {
            const card_back = [
                "┌─────────┐", 
                "│░░░░░░░░░│", 
                "│░░░???░░░│", 
                "│░░░░░░░░░│", 
                "└─────────┘"
            ];
            dealer_lines = [card_back].concat(dealer_hand.slice(1).map(c => c.display_lines()));
        } else {
            dealer_lines = dealer_hand.map(c => c.display_lines());
        }
        print("\n--- DEALER'S HAND ---");
        for (let i = 0; i < 5; i++) {
            print(dealer_lines.map(card => card[i]).join(" "));
        }
    }

    print("\n--- YOUR HAND ---");
    let player_lines = player_hand.map(c => c.display_lines());
    for (let i = 0; i < 5; i++) {
        print(player_lines.map(card => card[i]).join(" "));
    }
    print("");
}

// --- Blackjack Logic ---
function calculate_bj_score(hand) {
    let score = 0;
    let aces = 0;
    for (let card of hand) {
        score += BJ_VALUES[card.rank];
        if (card.rank === 'A') aces += 1;
    }
    while (score > 21 && aces > 0) {
        score -= 10;
        aces -= 1;
    }
    return score;
}

async function play_blackjack(player) {
    let deck = new Deck();
    clear_screen();
    print_header("BLACKJACK");

    let bet = 0;
    while (true) {
        player.print_status();
        let bet_input = await async_input(`Place your bet (Max $${player.money}): `);
        bet = parseInt(bet_input);
        if (!isNaN(bet) && bet > 0 && bet <= player.money) break;
        print("Invalid bet amount.\n");
    }

    let player_hand = [deck.deal(), deck.deal()];
    let dealer_hand = [deck.deal(), deck.deal()];
    let game_over = false;

    while (!game_over) {
        clear_screen();
        print_header("BLACKJACK TABLE");
        show_hands(player_hand, dealer_hand, true);
        
        let p_score = calculate_bj_score(player_hand);
        print(`Your Score: ${p_score}`);

        if (p_score === 21) {
            print("Blackjack! 21!");
            if (player_hand.length === 2) player.unlock_achievement("bj_native");
            break;
        } else if (p_score > 21) {
            print("Bust! You went over 21.");
            player.money -= bet;
            player.stats.losses += 1;
            player.stats.games_played += 1;
            player.check_stats_achievements();
            await async_input("\nPress Enter to continue...");
            return;
        }

        let choice = await async_input("(H)it or (S)tand? ");
        choice = choice.toLowerCase().trim();
        
        if (choice === 'h') {
            player_hand.push(deck.deal());
        } else if (choice === 's') {
            break;
        }
    }

    clear_screen();
    print_header("BLACKJACK SHOWDOWN");
    show_hands(player_hand, dealer_hand, false);
    
    let p_score = calculate_bj_score(player_hand);
    let d_score = calculate_bj_score(dealer_hand);

    while (d_score < 17) {
        print("Dealer hits...");
        await sleep(1000);
        dealer_hand.push(deck.deal());
        clear_screen();
        print_header("BLACKJACK SHOWDOWN");
        show_hands(player_hand, dealer_hand, false);
        d_score = calculate_bj_score(dealer_hand);
    }

    print(`Your Score: ${p_score} | Dealer Score: ${d_score}`);

    if (d_score > 21) {
        print("Dealer Busted! You Win!");
        player.money += bet;
        player.stats.wins += 1;
    } else if (d_score > p_score) {
        print("Dealer Wins.");
        player.money -= bet;
        player.stats.losses += 1;
    } else if (d_score < p_score) {
        print("You Win!");
        player.money += bet;
        player.stats.wins += 1;
    } else {
        print("Push (Tie). Money returned.");
        player.stats.pushes += 1;
    }

    player.stats.games_played += 1;
    player.check_stats_achievements();
    await async_input("\nPress Enter to return to menu...");
}

// --- Poker Logic ---
function evaluate_poker_hand(hand) {
    let ranks = hand.map(c => c.value).sort((a, b) => a - b);
    let suits = hand.map(c => c.suit);
    
    let is_flush = suits.every(s => s === suits[0]);
    let is_straight = (ranks[4] - ranks[0] === 4) && (new Set(ranks).size === 5);
    
    // A-2-3-4-5 straight check
    if (!is_straight && ranks.join(',') === '2,3,4,5,14') {
        is_straight = true;
        ranks = [1, 2, 3, 4, 5]; 
    }

    let counts = {};
    ranks.forEach(r => counts[r] = (counts[r] || 0) + 1);
    let sorted_counts = Object.entries(counts)
        .map(([r, c]) => [parseInt(r), c])
        .sort((a, b) => b[1] - a[1] || b[0] - a[0]); 

    if (is_straight && is_flush) {
        if (ranks[4] === 14) return { score: 10, desc: "Royal Flush", tie: ranks };
        return { score: 9, desc: "Straight Flush", tie: ranks };
    }
    if (sorted_counts[0][1] === 4) return { score: 8, desc: "Four of a Kind", tie: sorted_counts };
    if (sorted_counts[0][1] === 3 && sorted_counts[1][1] === 2) return { score: 7, desc: "Full House", tie: sorted_counts };
    if (is_flush) return { score: 6, desc: "Flush", tie: ranks };
    if (is_straight) return { score: 5, desc: "Straight", tie: ranks };
    if (sorted_counts[0][1] === 3) return { score: 4, desc: "Three of a Kind", tie: sorted_counts };
    if (sorted_counts[0][1] === 2 && sorted_counts[1][1] === 2) return { score: 3, desc: "Two Pair", tie: sorted_counts };
    if (sorted_counts[0][1] === 2) return { score: 2, desc: "One Pair", tie: sorted_counts };
    return { score: 1, desc: "High Card", tie: ranks };
}

function compare_ties(tie1, tie2, score) {
    if (score === 1 || score === 5 || score === 6 || score === 9) {
        for(let i=4; i>=0; i--) {
            if (tie1[i] !== tie2[i]) return tie1[i] - tie2[i];
        }
        return 0;
    } else {
        for(let i=0; i<tie1.length; i++) {
            if (tie1[i][0] !== tie2[i][0]) return tie1[i][0] - tie2[i][0];
        }
        return 0;
    }
}

async function play_poker(player) {
    let deck = new Deck();
    clear_screen();
    print_header("5-CARD DRAW POKER");

    let bet = 0;
    while (true) {
        player.print_status();
        let bet_input = await async_input(`Place your ante (Max $${player.money}): `);
        bet = parseInt(bet_input);
        if (!isNaN(bet) && bet > 0 && bet <= player.money) break;
        print("Invalid bet amount.\n");
    }

    let player_hand = [deck.deal(), deck.deal(), deck.deal(), deck.deal(), deck.deal()];
    let dealer_hand = [deck.deal(), deck.deal(), deck.deal(), deck.deal(), deck.deal()];

    clear_screen();
    print_header("POKER - DRAW PHASE");
    show_hands(player_hand, [], false);
    
    print("Which cards to discard? (e.g., '1 3 5'). Press Enter to keep all.");
    let choice = await async_input("Indices (1-5): ");
    
    if (choice.trim() !== '') {
        let indices = choice.split(' ').map(Number).map(n => n - 1).filter(n => n >= 0 && n < 5);
        indices.sort((a, b) => b - a); // Sort descending to pop correctly
        for (let idx of indices) {
            player_hand.splice(idx, 1);
        }
        while (player_hand.length < 5) {
            player_hand.push(deck.deal());
        }
    }

    clear_screen();
    print_header("POKER - SHOWDOWN");
    show_hands(player_hand, dealer_hand, false);

    let p_res = evaluate_poker_hand(player_hand);
    let d_res = evaluate_poker_hand(dealer_hand);

    print(`You have: ${p_res.desc}`);
    print(`Dealer has: ${d_res.desc}`);
    print("-".repeat(30));

    if (p_res.score === 2) await player.unlock_achievement("poker_pair");
    if (p_res.score === 6) await player.unlock_achievement("poker_flush");
    if (p_res.score === 10) await player.unlock_achievement("poker_royal");

    let win = false;
    let tie_breaker = compare_ties(p_res.tie, d_res.tie, p_res.score);

    if (p_res.score > d_res.score || (p_res.score === d_res.score && tie_breaker > 0)) {
        print(`You Win $${bet}!`);
        player.money += bet;
        player.stats.wins += 1;
    } else if (d_res.score > p_res.score || (p_res.score === d_res.score && tie_breaker < 0)) {
        print("Dealer Wins.");
        player.money -= bet;
        player.stats.losses += 1;
    } else {
        print("It's a complete tie.");
        player.stats.pushes += 1;
    }

    player.stats.games_played += 1;
    player.check_stats_achievements();
    await async_input("\nPress Enter to continue...");
}

                            print("[BANK] You don't have enough cash!");
                        } else {
                            let actual_pay = Math.min(amt, player.loan_debt);
                            player.money -= actual_pay;
                            player.loan_debt -= actual_pay;
                            print(`[BANK] Paid $${actual_pay}. Remaining debt: $${player.loan_debt}`);
                            
                            if (player.loan_debt === 0) await player.unlock_achievement("debt_free");
                            if (actual_pay === 50000) await player.unlock_achievement("clean_slate");
                        }
                    }
                }
            }
            await async_input("\nPress Enter to return...");
            
        } else if (choice === '4') {
            clear_screen();
            print_header("🏆 ACHIEVEMENTS 🏆");
            print(`Progress: ${player.unlocked_achievements.size}\n`);
            for (let [key, val] of Object.entries(ACHIEVEMENTS_DB)) {
                let status = player.unlocked_achievements.has(key) ? "✅" : "🔒";
                print(`${status} ${val.title.padEnd(20)} | ${val.desc}`);
            }
            await async_input("\nPress Enter to return...");
        } else if (choice === '5') {
            print("Thanks for playing!");
            break;
        }
    }
}

// Start the game loop
main();
</script>
